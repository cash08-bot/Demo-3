name: CDK Synth and Upload

on:
  workflow_call:
    inputs:
      env_id:
        required: true
        type: string
      role_to_assume:
        required: true
        type: string

env:
  AWS_REGION: us-east-1

jobs:
  synth-upload:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: ${{ inputs.role_to_assume }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install dependencies
        run: |
          npm install -g aws-cdk
          mvn install -DskipTests=true

      - name: Synth CDK
        run: |
          mkdir -p cdk.out
          cdk synth --context env=${{ inputs.env_id }} > cdk.out/cdk-${{ inputs.env_id }}.template.yml

      - name: Zip Synth Output
        run: |
          cd cdk.out
          zip ../cdk-${{ inputs.env_id }}.zip *

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: "CDK Synth Output - ${{ inputs.env_id }}"
          tag_name: "cdk-synth-${{ inputs.env_id }}-${{ github.sha }}"
          draft: false
          prerelease: false

      - name: Upload Synth ZIP to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "cdk-synth-${{ inputs.env_id }}-${{ github.sha }}"
          files: cdk-${{ inputs.env_id }}.zip
